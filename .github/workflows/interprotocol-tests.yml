name: Analysis tests
on:
  pull_request:
    paths:
      - 'ipid_analysis/**'
      - 'tests/**'
      - '.github/workflows/interprotocol-tests.yml'
      - 'requirements.txt'
      - 'requirements-py312.lock'
      - 'pyproject.toml'
      - 'Makefile'
      - 'benchmarks/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-linuxlibertine
      - run: python -m pip install -r requirements-py312.lock
      - run: python -m unittest discover -s tests -v
        env:
          MPLBACKEND: Agg
          IPID_ANALYSIS_STORAGE_MODE: local
