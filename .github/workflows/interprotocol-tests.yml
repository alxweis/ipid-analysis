name: Interprotocol tests
on:
  pull_request:
    paths:
      - 'ipid_analysis/**'
      - 'tests/**'
      - '.github/workflows/interprotocol-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-linuxlibertine
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_interprotocol*.py'
      - run: python -m unittest discover -s tests -p 'test_s3_workflow.py'
      - run: python -m unittest discover -s tests -p 'test_strategies.py'
